name: Validate release matrix

on:
  pull_request:
    paths:
      - '.github/workflows/release-*.yml'
      - '.github/scripts/release_gate.py'
      - '.github/engine-manifests/releases/**'

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release-builds.yml
    secrets:
      UE_RELEASE_MANIFEST_KEY: ${{ secrets.UE_RELEASE_MANIFEST_KEY }}
