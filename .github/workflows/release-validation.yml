name: Validate release matrix

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release-builds.yml
    secrets:
      UE_RELEASE_MANIFEST_KEY: ${{ secrets.UE_RELEASE_MANIFEST_KEY }}

  required:
    name: Required CI
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every engine and platform to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "Full matrix did not pass ($BUILD_RESULT). Fork changes must be tested on a repository branch."
            exit 1
          fi
