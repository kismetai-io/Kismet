name: Static checks

# Fast checks that need no Unreal Engine. They do not compile the plugin or run
# its automation tests; see CONTRIBUTING.md for building and testing a change.
# The panel job drives KismetAI/Config/ui.html in Chromium (CEF on Windows and
# Linux) and WebKit (WKWebView on macOS) against a fake editor bridge.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configuration, modules, scripts and include case
        run: python3 .github/scripts/static_checks.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Manifest security tests
        run: |
          python -m pip install pycryptodomex==3.24.2
          python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Packaging script parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'KismetAI/package.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Secret scan
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --no-banner --redact

  panel-ui:
    name: Panel behaviour tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install the test runner
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run the panel tests
        env:
          CI: 'true'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: panel-ui-results
          path: tests/ui/results
          retention-days: 7
