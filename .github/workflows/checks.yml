name: Static checks

# Fast checks that need no Unreal Engine. They do not compile the plugin or run
# its automation tests; see CONTRIBUTING.md for building and testing a change.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configuration, modules, scripts and include case
        run: python3 .github/scripts/static_checks.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Manifest security tests
        run: |
          python -m pip install pycryptodomex==3.24.2
          python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Packaging script parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'KismetAI/package.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Secret scan
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --no-banner --redact
