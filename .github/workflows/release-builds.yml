name: Release candidate builds

on:
  workflow_call:
    secrets:
      UE_RELEASE_MANIFEST_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: UE ${{ matrix.engine }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        engine: ['5.6', '5.7', '5.8', '5.9']
        platform: [Windows, Mac]
        include:
          - platform: Windows
            runner: windows-2022
            target: Win64
          - platform: Mac
            runner: macos-26
            target: Mac
          - engine: '5.6'
            platform: Mac
            runner: macos-15
            target: Mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ENGINE_VERSION: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select UE 5.6 compatible Xcode
        if: matrix.platform == 'Mac' && matrix.engine == '5.6'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Measure and reclaim runner disk
        shell: pwsh
        run: |
          "UE_ROOT=$env:RUNNER_TEMP/UE_${{ matrix.engine }}" >> $env:GITHUB_ENV
          "PACKAGE_ROOT=$env:RUNNER_TEMP/KismetPackage" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
          $free = (Get-Item $env:RUNNER_TEMP).PSDrive.Free
          if ($free -ge 60GB) {
            Write-Host 'At least 60 GiB is already free; preserving preinstalled runner software.'
            exit 0
          }
          if ($IsWindows) {
            $paths = @('C:\Android', 'C:\Program Files\Android', 'C:\hostedtoolcache\CodeQL', 'C:\hostedtoolcache\Java_Temurin-Hotspot_jdk', 'C:\hostedtoolcache\PyPy', 'C:\Program Files\Unity', 'C:\Program Files\Microsoft SQL Server', 'C:\Program Files\Mozilla Firefox', 'C:\Program Files\Google\Chrome')
          } else {
            $selected = (& xcode-select -p).Trim()
            $selected = (& python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' $selected).Trim()
            & sudo xcode-select --switch $selected
            & xcodebuild -version
            $paths = @('/Users/runner/Library/Android', '/usr/local/lib/android')
            $paths += @(Get-ChildItem /Applications -Directory -Filter 'Xcode*.app' | Where-Object { -not $selected.StartsWith($_.FullName + '/') } | ForEach-Object { $_.FullName })
          }
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Write-Host "Removing unused runner software: $path"
              if ($IsWindows) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Continue }
              else { & sudo rm -rf -- $path; if ($LASTEXITCODE -ne 0) { throw "Cleanup failed: $path" } }
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine download helper
        run: python -m pip install legendary-gl==0.21.1 pycryptodomex==3.24.2

      - name: Decrypt engine manifest
        shell: pwsh
        env:
          UE_MANIFEST_KEY: ${{ secrets.UE_RELEASE_MANIFEST_KEY }}
        run: |
          if (-not $env:UE_MANIFEST_KEY) { throw 'Repository secret UE_MANIFEST_KEY is missing' }
          python .github/scripts/engine_manifest.py '.github/engine-manifests/releases/${{ matrix.engine }}/${{ matrix.platform }}.manifest.enc' '${{ runner.temp }}/manifests/${{ matrix.platform }}.manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest authentication failed' }

      - name: Download stripped engine and verify hashes
        shell: pwsh
        run: |
          python .github/scripts/runner_engine.py '${{ runner.temp }}/manifests/${{ matrix.platform }}.manifest' "$env:UE_ROOT" --with-content
          if ($LASTEXITCODE -ne 0) { throw 'Engine provisioning failed' }

      - name: Configure clean-build compilation
        shell: pwsh
        run: |
          $configRoot = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'Unreal Engine/UnrealBuildTool'
          New-Item -ItemType Directory -Force $configRoot | Out-Null
          '<Configuration xmlns="https://www.unrealengine.com/BuildConfiguration"><BuildConfiguration><bUseAdaptiveUnityBuild>false</bUseAdaptiveUnityBuild><bAllCores>true</bAllCores></BuildConfiguration></Configuration>' | Set-Content (Join-Path $configRoot 'BuildConfiguration.xml')

      - name: Compile and package Kismet
        shell: pwsh
        run: |
          & ./KismetAI/package.ps1 -EnginePath "$env:UE_ROOT" -LauncherEnginePath "$env:UE_ROOT" -Variant release -TargetPlatforms '${{ matrix.target }}' -OutputDir "$env:PACKAGE_ROOT" -SkipManifest
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          Get-ChildItem "$env:PACKAGE_ROOT" -Filter '*.zip' | Select-Object Name,Length
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free

      - name: Run complete Kismet automation suite
        shell: pwsh
        run: |
          python .github/scripts/runner_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Automation tests failed' }

      - name: Record package checksums
        shell: pwsh
        run: |
          Get-ChildItem "$env:PACKAGE_ROOT" -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Tee-Object -FilePath "$env:PACKAGE_ROOT/checksums.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-UE${{ matrix.engine }}-${{ matrix.target }}
          path: |
            ${{ env.PACKAGE_ROOT }}/*.zip
            ${{ env.PACKAGE_ROOT }}/AutomationReport
            ${{ env.PACKAGE_ROOT }}/checksums.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
