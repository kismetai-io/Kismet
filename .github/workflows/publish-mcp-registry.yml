name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry. Run it by hand after a
# release whose server.json version changed. It signs in with the repository's
# own GitHub identity (OIDC), which is what lets it publish under the
# io.github.kismetai-io namespace; no token or secret is stored.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" mcp-publisher
          rm "$archive"

      - name: Validate
        run: ./mcp-publisher validate

      - name: Sign in with the repository identity
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
